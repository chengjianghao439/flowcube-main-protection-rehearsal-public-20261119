name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Tests fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: test "$(cat fixtures/tests.txt)" = pass
  pr-gate:
    name: Tests PR Gate
    needs: [fixture]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.fixture.result }}
        run: test "$RESULT" = success
